<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitation Slider</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="swiper mySwiper">

        <div class="swiper-wrapper">

            <!-- PAGE 1 -->
            <div class="swiper-slide page">
                <img src="assets/image.png" class="bottom-img" />
            </div>

            <!-- PAGE 2 -->
            <div class="swiper-slide page">
                <img src="assets/image.png" class="bottom-img" />
            </div>

            <!-- PAGE 3 -->
            <div class="swiper-slide page">
                <img src="assets/image.png" class="bottom-img" />
            </div>

        </div>

        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>

    </div>

    <!-- Floating text layer ABOVE swiper -->
    <div class="floating-text draggable-text">
        We invite you and your family's<br>
        gracious presence and blessing
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
